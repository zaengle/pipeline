name: Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # testbench 8.* -> Laravel 10 (PHP 8.1+)
          - { php: '8.1', testbench: '8.*' }
          - { php: '8.4', testbench: '8.*' }
          # testbench 9.* -> Laravel 11 (PHP 8.2+)
          - { php: '8.2', testbench: '9.*' }
          - { php: '8.4', testbench: '9.*' }
          # testbench 10.* -> Laravel 12 (PHP 8.2+)
          - { php: '8.2', testbench: '10.*' }
          - { php: '8.4', testbench: '10.*' }
          # testbench 11.* -> Laravel 13 (PHP 8.3+)
          - { php: '8.3', testbench: '11.*' }
          - { php: '8.4', testbench: '11.*' }

    name: PHP ${{ matrix.php }} / testbench ${{ matrix.testbench }}

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: ${{ matrix.php }}
        coverage: none

    - name: Validate composer.json
      run: composer validate --no-check-lock

    - name: Install dependencies
      run: |
        composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
        composer update --prefer-dist --no-interaction --no-progress

    - name: Run test suite
      run: composer run-script test
